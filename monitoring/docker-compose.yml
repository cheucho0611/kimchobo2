# 관제 스택: Loki(로그 저장) + Promtail(로그 수집) + Prometheus(상태 감시) + Grafana(화면)
# 실행: docker compose up -d
services:
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml   # 이미지 내장 기본 설정 사용
    ports: ["3100:3100"]

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - ./events:/var/log/events:ro        # 탐지 이벤트(JSONL)가 들어오는 폴더
    depends_on: [loki]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin       # 실습용 계정 (운영 환경에서는 변경)
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
