server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: detections
    static_configs:
      - targets: [localhost]
        labels:
          job: detections
          __path__: /var/log/events/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            severity: severity
            detection_type: detection_type
            data_origin: data_origin
      - labels:
          severity:
          detection_type:
          data_origin:
